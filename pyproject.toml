[project]
name = "bdantic"
version = "0.3.0"
dependencies = [
    "beancount~=2.3.6",
    "pydantic~=2.8",
    "beancount-stubs~=0.1.3",
    "orjson~=3.10.6",
    "jmespath~=1.0.1",
    "RandomWords~=0.4.0",
]
requires-python = ">= 3.10"
description = "A package for extending beancount with pydantic"
authors = [{ name = "Joshua Gilman", email = "joshuagilman@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["beancount", "pydantic", "models"]

[project.urls]
homepage = "https://github.com/jmgilman/bdantic"
repository = "https://github.com/jmgilman/bdantic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest~=8.3.2",
    "mypy~=1.11",
    "twine~=5.1.1",
    "hypothesis~=6.108.5",
    "RandomWords~=0.4.0",
    "mkdocstrings~=0.25.2",
    "mkdocs~=1.6.0",
    "pytest-helpers-namespace~=2021.12.29",
    "beancount-hypothesis @ git+https://github.com/yacoob/beancount-hypothesis.git@295cf9f",
    "isort~=5.13.2",
    "tox~=4.16.0",
    "coverage~=7.6.0",
    "bump-pydantic>=0.8.0",
]

[tool.ruff]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
